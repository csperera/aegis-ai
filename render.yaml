services:
  - type: web
    name: aegisai
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: "pip install -r requirements.txt && bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PROCESSED_DATA_PATH
        value: data/processed/cicids_clean.parquet
      - key: STREAM_RATE
        value: 5