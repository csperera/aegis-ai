services:
  - type: web
    name: aegisai
    runtime: python
    buildCommand: "pip install --upgrade pip setuptools && pip install -r requirements.txt && bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PROCESSED_DATA_PATH
        value: /data/cicids_clean.parquet
      - key: STREAM_RATE
        value: 1